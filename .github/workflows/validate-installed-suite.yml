name: validation installed full suite 20261015

on:
  push:
    branches: [ci/validate-wheel-cleanup-20261015]

permissions: {}

env:
  COLUMNS: 120
  UV_FROZEN: "1"

jobs:
  installed-suite:
    name: ${{ matrix.phase }} full installed suite ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]
        python-version: ["3.10", "3.14t", "3.15", "3.15t"]
        phase: [candidate]
        include:
          - os: ubuntu
            artifact: pypi_files_ubuntu_x86_64_auto
          - os: macos
            artifact: pypi_files_macos_aarch64_auto
          - os: windows
            artifact: pypi_files_windows_x86_64_auto
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      WATCHFILES_TEST_PERMISSION_DENIED_PATH: ${{ github.workspace }}/protected
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: verify immutable artifact source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/shaan-forks/watchfiles/actions/runs/38742677222 --jq .head_sha)" = c40aab8e4346c4a9445d7b0e81b5789c972ddc48
          test "$(gh api repos/shaan-forks/watchfiles/actions/runs/38744195243 --jq .head_sha)" = cea12b71f09d6c3067b351cd965f002f78ad8fa4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.phase == 'baseline' && format('baseline-smoke-{0}', matrix.os) || matrix.artifact }}
          path: wheel-artifacts
          repository: shaan-forks/watchfiles
          run-id: ${{ matrix.phase == 'baseline' && '38744195243' || '38742677222' }}
          github-token: ${{ github.token }}
      - if: matrix.os == 'ubuntu'
        run: |
          mkdir -p ${{ github.workspace }}/protected
          touch ${{ github.workspace }}/protected/test
          sudo chown -R root:root ${{ github.workspace }}/protected
          sudo chmod 700 ${{ github.workspace }}/protected
      - name: install immutable wheel and frozen dependencies outside source
        shell: bash
        run: |
          uv export --frozen --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/watchfiles-requirements.txt"
          uv venv --python "${{ matrix.python-version }}" "$RUNNER_TEMP/watchfiles-installed"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python_bin="$RUNNER_TEMP/watchfiles-installed/Scripts/python.exe"
          else
            python_bin="$RUNNER_TEMP/watchfiles-installed/bin/python"
          fi
          echo "WHEEL_PYTHON=$python_bin" >> "$GITHUB_ENV"
          uv pip sync --python "$python_bin" "$RUNNER_TEMP/watchfiles-requirements.txt" --require-hashes
          mkdir selected-wheels
          find wheel-artifacts -name '*.whl' -exec cp {} selected-wheels/ ";"
          uv pip install --python "$python_bin" --no-deps --no-index --find-links selected-wheels watchfiles==1.3.0
          uv pip freeze --python "$python_bin"
      - name: execute all unchanged upstream tests against the installed artifact
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/watchfiles-suite-evidence"
          cp .github/scripts/validate-installed-suite.py "$RUNNER_TEMP/validate-installed-suite.py"
          cd "$RUNNER_TEMP"
          "$WHEEL_PYTHON" -I validate-installed-suite.py "${{ matrix.python-version }}" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/watchfiles-suite-evidence"
      - name: retain test cases and artifact/module provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-suite-${{ matrix.phase }}-${{ matrix.os }}-${{ matrix.python-version }}
          path: ${{ runner.temp }}/watchfiles-suite-evidence
